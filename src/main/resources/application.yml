spring:
  session:
    store-type: redis
    timeout: 259200
  application:
    name: ai-code-mother-backend
    # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_mother
    username: root
    password: 12345678910
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 259200

# 当前未使用 Redis 向量存储，避免 starter 自动创建缺少专用参数的 EmbeddingStore。
langchain4j:
  community:
    redis:
      enabled: false

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.xy.aicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn



